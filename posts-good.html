        </svg></span> <span class="font-medium text-gray-700">Relatively short and concise</span> </button> <button id="opt-2" onclick="toggleOption(this, true)" class="analysis-option w-full text-left p-4 bg-white rounded-lg border-2 border-gray-200 hover:border-blue-300 transition-all duration-200 flex items-center gap-3"> <span class="checkmark w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 transition-all">

        </svg></span> <span class="font-medium text-gray-700">Clear, direct question</span> </button> <button id="opt-3" onclick="toggleOption(this, true)" class="analysis-option w-full text-left p-4 bg-white rounded-lg border-2 border-gray-200 hover:border-blue-300 transition-all duration-200 flex items-center gap-3"> <span class="checkmark w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 transition-all">

        <svg class="w-4 h-4 text-white hidden" fill="currentColor" viewbox="0 0 20 20">

        </svg></span> <span class="font-medium text-gray-700">Is encouraging and uplifting</span> </button> <button id="opt-6" onclick="toggleOption(this, false)" class="analysis-option w-full text-left p-4 bg-white rounded-lg border-2 border-gray-200 hover:border-blue-300 transition-all duration-200 flex items-center gap-3"> <span class="checkmark w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 transition-all">
        <svg class="w-4 h-4 text-white hidden" fill="currentColor" viewbox="0 0 20 20">

    </div><!-- Full-Width Check Answers Button --> <button id="check-btn" onclick="checkAnswers()" class="w-full py-4 rounded-lg font-semibold text-white text-lg transition-all duration-200 hover:shadow-lg transform hover:-translate-y-0.5 mb-6" style="background-color: #0070F0;"> Check My Answers </button> <!-- Feedback Area -->
    <div id="feedback" class="p-5 rounded-xl hidden">
     <div class="flex items-start gap-3"><span id="feedback-icon" class="text-2xl"></span>
      <div>
       <p id="feedback-title" class="font-bold text-lg mb-1"></p>

     </div>
    </div><!-- Reset Button --> <button id="reset-btn" onclick="resetQuiz()" class="hidden w-full mt-4 py-3 rounded-lg font-semibold border-2 transition-all duration-200 hover:bg-gray-100" style="border-color: #002855; color: #002855;"> Try Again </button>

  <script>
    const defaultConfig = {
      main_title: "Why Is This Post Effective?",
      instruction_text: "Click on the elements below that make this post work well",
      primary_color: "#002855",
      accent_color: "#0070F0",
      success_color: "#97E152",
      highlight_color: "#46B1EF",
      background_color: "#F1F1F1"
    };

    const posts = [
      {
        id: 1,
        author: "Bryan Ramey",
        group: "Peer Coach Student Intern",
        avatar: "BR",
        borderColor: "#0070F0",
        gradientStart: "#0070F0",
        gradientEnd: "#46B1EF",
        title: "Which Udemy Course Do you Prefer?",
        content: "Which Udemy Course do you prefer to study for Network+?",
        details: [
          "• Andrew Ramdayal CompTIA Network+ N10-009 Full Course, Labs, Course Notes | Udemy Business",
          "• Jason Dion CompTIA Network+ (N10-009) Full Course & Practice Exam | Udemy Business",
          "• Mike Myers TOTAL: CompTIA Network+ (N10-009) + Practice Exam | Udemy Business",
          "",
          "Or…",
          "",
          "Professor Messer How to Pass Your CompTIA N10-009 Network+ Exam"
        ],
        correctAnswers: ['opt-1', 'opt-2', 'opt-3', 'opt-4'],
        incorrectAnswers: ['opt-5', 'opt-6']
      },
      {
        id: 2,
        author: "Ashley Collins",
        group: "Peer Coach Student Intern",
        avatar: "AC",
        borderColor: "#10B981",
        gradientStart: "#10B981",
        gradientEnd: "#34D399",
        title: "Your Go-To Study Breaks",
        content: "What's your go-to way to take a break without losing momentum?",
        details: [
          "Quick walk, music, stretching, power nap — or something else?"
        ],
        correctAnswers: ['opt-1', 'opt-2', 'opt-3'],
        incorrectAnswers: ['opt-5', 'opt-6']
      },
      {
        id: 3,
        author: "Zaakirah Taylor",
        group: "Peer Coach Student Intern",
        avatar: "ZT",
        borderColor: "#F59E0B",
        gradientStart: "#F59E0B",
        gradientEnd: "#FBBF24",
        title: "🔑 Your 5-Step Guide to Mastering Systems Thinking",
        content: "Hey everyone,\n\nIf you're feeling overwhelmed by all the reading, I put together a quick list of the 5 essential concepts and tools you need to master. They are all listed under the \"Learn the Basics\" section on the Systems Thinking Tips page, and they're the building blocks for the tasks!",
        details: [
          "Systems and Systems Thinking: Understand the core idea of looking at the whole picture and the relationships between parts, not just individual events.",
          "Iceberg Model: This is for Task 1. Learn to look past a surface-level event to see the patterns and, most importantly, the underlying structure (mental models/system design) that causes them.",
          "Behavior Over Time Graphs (BOTs): Also for Task 1. You need to select and apply the graph that accurately shows the trend of key variables in your case study over time.",
          "Causal Loop Diagrams (CLDs): Crucial for Task 2. These diagrams show the cause-and-effect relationships within a system, specifically how reinforcing (R) and balancing (B) loops create outcomes.",
          "Systems Archetypes: The other half of Task 2. Archetypes are common, recurring CLD patterns (like \"Fixes that Fail\") that help you quickly identify and explain a system's common problems and leverage points.",
          "",
          "If you know these five concepts, you've got the foundation to ace the tasks!",
          "",
          "Which one of these concepts was the hardest for you to grasp initially?"
        ],
        correctAnswers: ['opt-2', 'opt-3', 'opt-5'],
        incorrectAnswers: ['opt-1', 'opt-6']
      },
      {
        id: 4,
        author: "Keila Clark",
        group: "Peer Coach Student Intern",
        avatar: "KC",
        borderColor: "#8B5CF6",
        gradientStart: "#8B5CF6",
        gradientEnd: "#A78BFA",
        title: "Hi C165 learners! 👋",
        content: "Here's a little support for this week:",
        details: [
          "Study Tip: Break down complex problems into smaller steps and tackle one operation at a time.",
          "",
          "Remember that white boards are useable in all courses not just math!",
          "",
          "WGU Resources:",
          "  • C165 Course Notes & Practice Problems",
          "  • Lesson Videos and Study Modules in your WGU portal",
          "",
          "Peer Coaching: Struggling with a concept or problem? Reply here — I will get you the schedule link. We can set up a time to look at the available resources together to find the ones that will work best for you.",
          "",
          "Keep practicing — every problem you work through gets you closer to mastering the material! 💪"
        ],
        correctAnswers: ['opt-1', 'opt-2', 'opt-3', 'opt-4', 'opt-5'],
        incorrectAnswers: ['opt-6']
      }
    ];

    let currentPost = 1;
    let selectedOptions = new Set();
    let answered = false;

    function renderPost(postId) {
      const post = posts[postId - 1];
      const postContent = document.getElementById('post-content');
      
      postContent.style.borderLeftColor = post.borderColor;
      
      let html = `
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style="background: linear-gradient(135deg, ${post.gradientStart}, ${post.gradientEnd});">
            ${post.avatar}
          </div>
          <div>
            <p class="font-semibold" style="color: #002855;">${post.author}</p>
            <p class="text-xs text-gray-500">Moderator - ${post.group}</p>
          </div>
        </div>
        <div class="space-y-3 text-gray-800">
          <p class="font-semibold text-lg" style="color: #002855;">${post.title}</p>
      `;
      
      if (post.content.includes('\n')) {
        html += `<p>${post.content.split('\n').join('</p><p>')}</p>`;
      } else {
        html += `<p>${post.content}</p>`;
      }
      
      html += '<div class="space-y-2 text-sm">';
      post.details.forEach(detail => {
        if (detail === '') {
          html += '';
        } else if (detail.startsWith('  •')) {
          html += `<p style="margin-left: 1.5rem;">${detail.substring(3)}</p>`;
        } else {
          html += `<p>${detail}</p>`;
        }
      });
      html += '</div></div>';
      
      postContent.innerHTML = html;
    }

    function switchPost(postId) {
      if (answered) {
        alert('Please click "Try Again" before switching posts.');
        return;
      }
      
      currentPost = postId;
      renderPost(postId);
      
      // Update button states
      document.querySelectorAll('.post-nav-btn').forEach(btn => {
        if (btn.dataset.post == postId) {
          btn.style.backgroundColor = '#0070F0';
          btn.style.color = 'white';
        } else {
          btn.style.backgroundColor = '#D0D0D0';
          btn.style.color = '#333';
        }
      });
      
      resetQuiz();
    }

    function toggleOption(btn, isCorrect) {
      if (answered) return;
      
      const optionId = btn.id;
      const checkmark = btn.querySelector('.checkmark');
      const svg = checkmark.querySelector('svg');
      
      if (selectedOptions.has(optionId)) {
        selectedOptions.delete(optionId);
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-200');
        checkmark.classList.remove('bg-blue-500', 'border-blue-500');
        checkmark.classList.add('border-gray-300');
        svg.classList.add('hidden');
      } else {
        selectedOptions.add(optionId);
        btn.classList.add('border-blue-500', 'bg-blue-50');
        btn.classList.remove('border-gray-200');
        checkmark.classList.add('bg-blue-500', 'border-blue-500');
        checkmark.classList.remove('border-gray-300');
        svg.classList.remove('hidden');
      }
    }

    function checkAnswers() {
      if (answered) return;
      answered = true;

      const post = posts[currentPost - 1];
      const correctAnswers = post.correctAnswers;
      const incorrectAnswers = post.incorrectAnswers;
      
      let correctCount = 0;
      let wrongSelections = 0;

      // Check correct answers
      correctAnswers.forEach(id => {
        const btn = document.getElementById(id);
        if (selectedOptions.has(id)) {
          correctCount++;
          btn.style.borderColor = '#97E152';
          btn.style.backgroundColor = '#f0fdf4';
        } else {
          btn.style.borderColor = '#fbbf24';
          btn.style.backgroundColor = '#fffbeb';
        }
      });

      // Check incorrect answers
      incorrectAnswers.forEach(id => {
        const btn = document.getElementById(id);
        if (selectedOptions.has(id)) {
          wrongSelections++;
          btn.style.borderColor = '#ef4444';
          btn.style.backgroundColor = '#fef2f2';
        }
      });

      // Show feedback
      const feedback = document.getElementById('feedback');
      const feedbackIcon = document.getElementById('feedback-icon');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackText = document.getElementById('feedback-text');
      
      feedback.classList.remove('hidden');
      
      if (correctCount === correctAnswers.length && wrongSelections === 0) {
        feedback.style.backgroundColor = '#dcfce7';
        feedback.style.color = '#166534';
        feedbackIcon.textContent = '🎉';
        feedbackTitle.textContent = 'Perfect!';
        feedbackText.textContent = 'You identified all the key elements that make this post effective!';
      } else if (correctCount >= correctAnswers.length - 1 && wrongSelections <= 1) {
        feedback.style.backgroundColor = '#fef3c7';
        feedback.style.color = '#92400e';
        feedbackIcon.textContent = '👍';
        feedbackTitle.textContent = 'Good job!';
        feedbackText.textContent = 'You got most of them right. Review the highlighted answers to see what makes an effective post.';
      } else {
        feedback.style.backgroundColor = '#fee2e2';
        feedback.style.color = '#991b1b';
        feedbackIcon.textContent = '💡';
        feedbackTitle.textContent = 'Keep learning!';
        feedbackText.textContent = 'Take another look at the post. Effective posts are clear, direct, relevant, and encouraging!';
      }

      document.getElementById('check-btn').style.display = 'none';
      document.getElementById('reset-btn').classList.remove('hidden');
    }

    function resetQuiz() {
      answered = false;
      selectedOptions.clear();
      
      document.querySelectorAll('.analysis-option').forEach(btn => {
        btn.style.borderColor = '';
        btn.style.backgroundColor = '';
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-200');
        
        const checkmark = btn.querySelector('.checkmark');
        const svg = checkmark.querySelector('svg');
        checkmark.classList.remove('bg-blue-500', 'border-blue-500');
        checkmark.classList.add('border-gray-300');
        svg.classList.add('hidden');
      });

      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('check-btn').style.display = 'block';
      document.getElementById('reset-btn').classList.add('hidden');
    }

    // Initialize with first post
    document.addEventListener('DOMContentLoaded', () => {
      renderPost(1);
    });

    // Element SDK initialization
    async function onConfigChange(config) {
      document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
      document.getElementById('instruction-text').textContent = config.instruction_text || defaultConfig.instruction_text;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => window.elementSdk.setConfig({ background_color: value })
            },
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => window.elementSdk.setConfig({ primary_color: value })
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => window.elementSdk.setConfig({ accent_color: value })
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["instruction_text", config.instruction_text || defaultConfig.instruction_text]
        ])
      });
    }
  </script>
